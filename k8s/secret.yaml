# API keys. These are PLACEHOLDERS ONLY; the app treats them as "no key" (HTTP 503).
# Reference only: not in kustomization.yaml. scripts/deploy-k8s.sh creates the real Secret.
# Do NOT put a real key in this file. Create the real Secret from the command line:
#   kubectl -n meditriage create secret generic meditriage-secrets \
#     --from-literal=GROQ_API_KEY=gsk_... --from-literal=GEMINI_API_KEY= \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: meditriage-secrets
  namespace: meditriage
type: Opaque
stringData:                         # stringData = plain text here, Kubernetes base64-encodes it
  GROQ_API_KEY: "your_groq_api_key_here"
  GEMINI_API_KEY: "your_gemini_api_key_here"
