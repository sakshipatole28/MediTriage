# Runs 2 copies (pods) of the MediTriage API and keeps them running.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meditriage-api
  namespace: meditriage
  labels:
    app: meditriage-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: meditriage-api
  template:
    metadata:
      labels:
        app: meditriage-api
    spec:
      securityContext:
        runAsNonRoot: true          # refuse to start if the image would run as root
        runAsUser: 10001            # same UID as "appuser" in the Dockerfile
        runAsGroup: 10001
      containers:
        - name: api
          image: meditriage:1.0            # the pipelines replace this with the tag they built
          imagePullPolicy: IfNotPresent   # use the locally loaded image (minikube/kind)
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: meditriage-config
            - secretRef:
                name: meditriage-secrets
          readinessProbe:           # "ready to receive traffic?" If not, the Service skips this pod.
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:            # "still alive?" If not, Kubernetes restarts the container.
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:               # guaranteed minimum, used for scheduling
              cpu: "100m"
              memory: "128Mi"
            limits:                 # hard maximum; above the memory limit the pod is killed
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
